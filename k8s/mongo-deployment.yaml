# MongoDB dedicado ao CatalogAPI (guarda as avaliações de jogos — dado
# flexível, sem schema fixo). Segue o mesmo padrão do SQL Server: mora
# aqui, dentro do repositório do próprio microsserviço, porque ninguém
# mais usa este banco. Dados em disco persistente (PVC).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-mongo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog-mongo
  template:
    metadata:
      labels:
        app: catalog-mongo
    spec:
      containers:
        - name: catalog-mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: catalog-mongo-data
              mountPath: /data/db
      volumes:
        - name: catalog-mongo-data
          persistentVolumeClaim:
            claimName: catalog-mongo-data
