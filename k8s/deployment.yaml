# CatalogAPI. A pipeline (.github/workflows/ci-cd.yml) troca "fcg-catalog-api:latest"
# pela imagem versionada do ACR (ex.: <ACR_NAME>.azurecr.io/fcg-catalog-api:42)
# antes do kubectl apply — localmente (Docker Desktop) o valor abaixo continua valendo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
spec:
  replicas: 2
  # Rolling Update sem downtime: sobe 1 Pod novo por vez (maxSurge) e só derruba
  # um antigo depois que o novo passar no readinessProbe (maxUnavailable: 0).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: fcg-catalog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Configurações não sensíveis vêm do ConfigMap; credenciais vêm do Secret
          # "catalog-secret", criado pela pipeline a partir dos Secrets do GitHub (nunca do Git).
          envFrom:
            - configMapRef:
                name: catalog-config
            - secretRef:
                name: catalog-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
